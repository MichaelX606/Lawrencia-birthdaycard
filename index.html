        .dot { width: 12px; height: 12px; border-radius: 50%; background: #ddd; cursor: pointer; }
        .dot.active { background: #d946aa; }
        .buttons { display: flex; gap: 10px; justify-content: center; }
        .btn { padding: 12px 25px; border: none; border-radius: 25px; font-size: 1em; font-weight: 600; cursor: pointer; }
        .btn-primary { background: linear-gradient(135deg, #d946aa, #ec4899); color: white; }
        .btn-primary:hover { transform: scale(1.05); }
        .btn-secondary { background: rgba(217, 70, 170, 0.2); color: #d946aa; border: 2px solid #d946aa; }
    </style>
</head>
